name: QM1 Main Regression

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qm1-main-regression
  cancel-in-progress: false

jobs:
  build:
    name: Build default simulator
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Wait before checkout retry
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Retry checkout source and submodules
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Wait for standalone regression
        shell: bash
        run: |
          pid_file=/home/houruyao/qimeng1-serial-regression/runner.pid
          while [[ -f $pid_file ]] && kill -0 "$(cat "$pid_file")" 2>/dev/null; do
            echo "Standalone serial regression is still running; wait 60 seconds"
            sleep 60
          done

      - name: Apply GCC 13 compatibility patch
        shell: bash
        run: ./ci/apply_gcc13_compat.sh

      - name: Build default simulator
        shell: bash
        run: |
          make -C GenSimpoint -j16 librefcpu.a
          make -j16 default

      - name: Upload simulator
        uses: actions/upload-artifact@v7
        with:
          name: qm1-main-simulator-${{ github.run_id }}
          path: |
            build/simulator
            script/run_serial_regression.sh
          if-no-files-found: error
          retention-days: 7

  cpu-tests:
    name: CPU tests (39)
    needs: build
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 60

    steps:
      - name: Download simulator and regression script
        uses: actions/download-artifact@v7
        with:
          name: qm1-main-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Run CPU tests
        shell: bash
        env:
          RUN_SHORT: "1"
          RUN_DHRYSTONE: "0"
          RUN_COREMARK: "0"
          RUN_LINUX: "0"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/build/simulator
          REGRESSION_SCRIPT: ${{ github.workspace }}/ci-artifacts/script/run_serial_regression.sh
          SHORT_BIN_DIR: /home/houruyao/qimeng1-serial-regression/source/baremetal/test/build
          RESULT_ROOT: ${{ runner.temp }}/qm1-main-cpu-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          bash "$REGRESSION_SCRIPT"

      - name: Upload CPU-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qm1-main-cpu-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-main-cpu-results
          if-no-files-found: warn
          retention-days: 30

  dhrystone:
    name: Dhrystone
    needs: cpu-tests
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 130

    steps:
      - name: Download simulator and regression script
        uses: actions/download-artifact@v7
        with:
          name: qm1-main-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Run Dhrystone
        shell: bash
        env:
          RUN_SHORT: "0"
          RUN_DHRYSTONE: "1"
          RUN_COREMARK: "0"
          RUN_LINUX: "0"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/build/simulator
          REGRESSION_SCRIPT: ${{ github.workspace }}/ci-artifacts/script/run_serial_regression.sh
          DHRYSTONE_BIN: /home/houruyao/qimeng1-serial-regression/source/baremetal/dhrystone/build/dhrystone.bin
          RESULT_ROOT: ${{ runner.temp }}/qm1-main-dhrystone-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          bash "$REGRESSION_SCRIPT"

      - name: Upload Dhrystone log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qm1-main-dhrystone-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-main-dhrystone-results
          if-no-files-found: warn
          retention-days: 30

  coremark:
    name: CoreMark
    needs: dhrystone
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 130

    steps:
      - name: Download simulator and regression script
        uses: actions/download-artifact@v7
        with:
          name: qm1-main-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Run CoreMark
        shell: bash
        env:
          RUN_SHORT: "0"
          RUN_DHRYSTONE: "0"
          RUN_COREMARK: "1"
          RUN_LINUX: "0"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/build/simulator
          REGRESSION_SCRIPT: ${{ github.workspace }}/ci-artifacts/script/run_serial_regression.sh
          COREMARK_BIN: /home/houruyao/qimeng1-serial-regression/source/baremetal/coremark/build/coremark.bin
          RESULT_ROOT: ${{ runner.temp }}/qm1-main-coremark-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          bash "$REGRESSION_SCRIPT"

      - name: Upload CoreMark log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qm1-main-coremark-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-main-coremark-results
          if-no-files-found: warn
          retention-days: 30

  linux-libquantum:
    name: Linux boot + SPEC2006 462.libquantum
    needs: coremark
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 720

    steps:
      - name: Download simulator and regression script
        uses: actions/download-artifact@v7
        with:
          name: qm1-main-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Boot Linux and run 462.libquantum
        shell: bash
        env:
          RUN_SHORT: "0"
          RUN_DHRYSTONE: "0"
          RUN_COREMARK: "0"
          RUN_LINUX: "1"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/build/simulator
          REGRESSION_SCRIPT: ${{ github.workspace }}/ci-artifacts/script/run_serial_regression.sh
          SPIFLASH_IMAGE: /home/houruyao/qimeng1-serial-regression/source/regression-images/spiflash.bin
          LIBQUANTUM_SDCARD: /home/houruyao/qimeng1-serial-regression/source/regression-images/462.libquantum-sdcard.img
          RESULT_ROOT: ${{ runner.temp }}/qm1-main-linux-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          bash "$REGRESSION_SCRIPT"

      - name: Publish Linux regression summary
        if: always()
        shell: bash
        run: |
          result_dir=$(find "${{ runner.temp }}/qm1-main-linux-results" \
            -mindepth 1 -maxdepth 1 -type d -name 'serial-*' 2>/dev/null \
            | sort | tail -n 1)
          if [[ -n $result_dir && -f $result_dir/final_status.txt ]]; then
            echo "## Linux + 462.libquantum" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' "$result_dir/final_status.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Linux regression log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qm1-main-linux-libquantum-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-main-linux-results
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy validated simulator
    needs: linux-libquantum
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 15

    steps:
      - name: Download simulator
        uses: actions/download-artifact@v7
        with:
          name: qm1-main-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Deploy validated simulator
        shell: bash
        run: |
          deploy_root=/home/houruyao/qimeng1-ci-deploy
          release_dir=$deploy_root/releases/$GITHUB_SHA
          mkdir -p "$release_dir"
          install -m 0755 ci-artifacts/build/simulator "$release_dir/simulator"
          sha256sum "$release_dir/simulator" > "$release_dir/SHA256SUMS"
          printf '%s\n' \
            "git_sha=$GITHUB_SHA" \
            "workflow_run=$GITHUB_RUN_ID" \
            "deployed=$(date --iso-8601=seconds)" \
            > "$release_dir/manifest.txt"
          ln -sfn "$release_dir" "$deploy_root/current.new"
          mv -Tf "$deploy_root/current.new" "$deploy_root/current"
