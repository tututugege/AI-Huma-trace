name: QM1 PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qm1-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build default simulator
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Wait for standalone regression
        shell: bash
        run: |
          pid_file=/home/houruyao/qimeng1-serial-regression/runner.pid
          while [[ -f $pid_file ]] && kill -0 "$(cat "$pid_file")" 2>/dev/null; do
            echo "Standalone serial regression is still running; wait 60 seconds"
            sleep 60
          done

      - name: Apply GCC 13 compatibility patch
        shell: bash
        run: ./ci/apply_gcc13_compat.sh

      - name: Build default simulator
        shell: bash
        run: |
          make -C GenSimpoint -j16 librefcpu.a
          make -j16 default

      - name: Upload simulator
        uses: actions/upload-artifact@v4
        with:
          name: qm1-pr-simulator-${{ github.run_id }}
          path: build/simulator
          if-no-files-found: error
          retention-days: 7

  cpu-tests:
    name: CPU tests (39)
    needs: build
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 60

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: qm1-pr-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Run CPU tests
        shell: bash
        env:
          RUN_SHORT: "1"
          RUN_DHRYSTONE: "0"
          RUN_COREMARK: "0"
          RUN_LINUX: "0"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/simulator
          SHORT_BIN_DIR: /home/houruyao/qimeng1-serial-regression/source/baremetal/test/build
          RESULT_ROOT: ${{ runner.temp }}/qm1-pr-cpu-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          ./script/run_serial_regression.sh

      - name: Upload CPU-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qm1-pr-cpu-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-pr-cpu-results
          if-no-files-found: warn
          retention-days: 14

  dhrystone:
    name: Dhrystone
    needs: cpu-tests
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 130

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: qm1-pr-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Run Dhrystone
        shell: bash
        env:
          RUN_SHORT: "0"
          RUN_DHRYSTONE: "1"
          RUN_COREMARK: "0"
          RUN_LINUX: "0"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/simulator
          DHRYSTONE_BIN: /home/houruyao/qimeng1-serial-regression/source/baremetal/dhrystone/build/dhrystone.bin
          RESULT_ROOT: ${{ runner.temp }}/qm1-pr-dhrystone-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          ./script/run_serial_regression.sh

      - name: Upload Dhrystone log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qm1-pr-dhrystone-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-pr-dhrystone-results
          if-no-files-found: warn
          retention-days: 14

  coremark:
    name: CoreMark
    needs: dhrystone
    runs-on: [self-hosted, Linux, X64, qm1-regression]
    timeout-minutes: 130

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: qm1-pr-simulator-${{ github.run_id }}
          path: ci-artifacts

      - name: Run CoreMark
        shell: bash
        env:
          RUN_SHORT: "0"
          RUN_DHRYSTONE: "0"
          RUN_COREMARK: "1"
          RUN_LINUX: "0"
          SIMULATOR: ${{ github.workspace }}/ci-artifacts/simulator
          COREMARK_BIN: /home/houruyao/qimeng1-serial-regression/source/baremetal/coremark/build/coremark.bin
          RESULT_ROOT: ${{ runner.temp }}/qm1-pr-coremark-results
          PIN_CPU: "0"
        run: |
          chmod +x "$SIMULATOR"
          ./script/run_serial_regression.sh

      - name: Upload CoreMark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qm1-pr-coremark-${{ github.run_id }}
          path: ${{ runner.temp }}/qm1-pr-coremark-results
          if-no-files-found: warn
          retention-days: 14
